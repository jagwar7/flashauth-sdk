<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!-- <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;1,500&display=swap" rel="stylesheet"> -->
    <title>Document</title>
    <style>
        html, body {
      height: 100%;
      margin: 0;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .window{
      height: 40rem;
      width: 30rem;
      background : linear-gradient(135deg, #3B0D6F 0%, #22083b 50%, #260b4a 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      border-radius: 18px;
    }

    /* ✅ Brand FIXED */
    .brand {
      position: relative;
      top: 25px; /* ✅ brand moved down */
      display: flex;
      align-items: flex-start;
      gap: 8px;
      z-index: 50;
    }

    .gradient-text {
      font-weight: 900;
      font-style: italic;
      font-family: 'Archivo', sans-serif;
      letter-spacing: 1px;
      background: linear-gradient(180deg, #ff1100 0%, #ff7a4d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-text {
      font-size: 1.65rem;
    }

    /* ✅ AUTH + by jagwar stacked properly */
    .brand-text-group {
      display: flex;
      flex-direction: column;
      margin-top: -4px;
      line-height: 1.20rem;
      padding-top: 8px;
    }

    .auth-text {
      font-size: 1.65rem;
      line-height: 1.75rem;
    }

    .by-text {
      font-size: 0.6rem;
      font-weight: 900;
      padding-left: 20PX;
      margin-top: -2px;
      opacity: 0.9;

    }

    .brand-icon-svg {
      width: 42px;
      height: 42px;
      animation: glow 1.5s infinite ease-in-out;
    }

    @keyframes glow {
      0%,100% { filter: drop-shadow(0 0 6px rgba(255,69,0,0.6)); }
      50% { filter: drop-shadow(0 0 20px rgba(255,69,0,1)); }
    }

    .circle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      border: 6px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.01);
      box-shadow: 0 8px 24px rgba(2,6,23,0.6),
                  0 0 10px rgba(34,197,94,0.06);
    }

    .checkmark { width: 230px; height: 230px; }

    .circle {
      stroke: #ff4500;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 260;
      stroke-dashoffset: 260;
      animation: circle 1s forwards ease-in-out;
    }
    @keyframes circle { to { stroke-dashoffset: 0; } }

    @keyframes glow {
    0%, 100% {
        filter: drop-shadow(0 0 6px rgba(255,69,0,0.6))
                drop-shadow(0 0 4px rgba(255,69,0,0.5));
    }
    50% {
        filter: drop-shadow(0 0 20px rgba(255,69,0,1))
                drop-shadow(0 0 10px rgba(255,69,0,0.8));
    }
    }

    .check {
    stroke: #ff4500;
    stroke-width: 8;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 65;
    stroke-dashoffset: 65;
    animation: check 1s forwards ease-in-out 0.2s, glow 1.5s infinite alternate 0.2s;
    }
    @keyframes check { to { stroke-dashoffset: 0; } }

    .bottom-area { height: 2rem; }
        /* .window {
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        } */

        .form-container {
            padding: 0;
            width: 80%;
            color: white;
            font-family: 'Archivo', sans-serif;
        }

        .form-container h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .form-group input {
            outline: none;
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .submit-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 700;
            margin-top: 10px;
            background-color: #ccc; /* Default gray color */
            
        }
        .submit-btn:hover{
            scale: 0.95;
            transition: 0.2s ease-in-out;
        }

        .submit-btn.enabled {
            background: linear-gradient(180deg, #ff4500, #ff7a4d); /* Theme gradient when enabled */
            color: white;
        }

        .signin-link {
            margin-top: 15px;
            font-size: 14px;
            text-decoration: none;
            font-family: 'Archivo', sans-serif; /* Ensure font consistency */
        }

        .signin-link a {
            background: linear-gradient(180deg, #ff4500 0%, #ff7a4d 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent; /* Make the text color transparent to show the gradient */
            font-weight: 700;
            text-decoration: none;
        }
        .error-message {
            margin-top: 10px;
            font-size: 14px;
            color: red; /* Error message in red */
        }

        .success-message {
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="window">
            <div class="brand">
                <span class="brand-text gradient-text">FLASH</span>
                <svg class="brand-icon-svg" viewBox="0 0 1024 1024">
                    <defs>
                        <linearGradient id="brandGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ff4500" />
                            <stop offset="100%" stop-color="#ff7a4d" />
                        </linearGradient>
                    </defs>
                    <path d="M704 469.333333h-200.533333L640 106.666667H405.333333l-128 448h183.466667L362.666667 960z" fill="url(#brandGradient)" />
                </svg>
                <span class="brand-text-group">
                    <span class="auth-text gradient-text">AUTH</span>
                    <span class="by-text gradient-text">by JAGWAR</span>
                </span>
            </div>

            <!-- FORM AREA -->
            <div class="form-container">
                <h2>SIGN IN</h2>
                <form id="signupForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <button type="submit" class="submit-btn">SUBMIT</button>
                    <div class="error-message" id="errorMessage"></div>
                    <div class="success-message" id="successMessage">Signed in successfully!</div>
                </form>
                <div class="signin-link">
                    New user? <a  href="signin.html">SIGN UP</a>
                </div>
            </div>
            <!-- END FORM AREA -->

            <div class="bottom-area"></div>
        </div>
    </div>
        <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const submitBtn = this.querySelector('.submit-btn');

            // Reset messages on every submit
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none'; // Ensure success message is hidden
            errorMessage.textContent = '';
            successMessage.textContent = 'Signed in successfully!'; // Set success message text

            // Basic validation for login
            if (!email || !password) {
                errorMessage.textContent = 'Please fill in all fields!';
                errorMessage.style.display = 'block';
                return;
            }

            // Disable button during submission
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            // Simulate API call
            setTimeout(() => {
                if (Math.random() > 0.2) {
                    successMessage.style.display = 'block'; // Show success message on success
                    this.reset();
                } else {
                    errorMessage.textContent = 'Invalid email or password. Please try again.';
                    errorMessage.style.display = 'block';
                }

                submitBtn.disabled = false;
                submitBtn.textContent = 'SUBMIT';
            }, 1500);
        });

        // Check input fields and toggle submit button color
        const inputs = document.querySelectorAll('#signupForm input');
        const submitBtn = document.querySelector('.submit-btn');

        function checkInputs() {
            const allFilled = Array.from(inputs).every(input => input.value.trim() !== '');
            if (allFilled) {
                submitBtn.classList.add('enabled');
            } else {
                submitBtn.classList.remove('enabled');
            }
        }

        inputs.forEach(input => {
            input.addEventListener('input', checkInputs);
        });

        // Initial check and hide messages on page load
        window.addEventListener('load', function() {
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none'; // Hide success message on load
        });

        // Initial check
        checkInputs();
    </script>
</body>
</html>
